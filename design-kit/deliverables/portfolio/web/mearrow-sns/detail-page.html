<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEARROW SNS web portfolio detail</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../mearrow-device-frames.css">
</head>
<body class="asset-page mearrow-web-asset-page mearrow-web-detail-page">
  <div class="asset-actions"><a class="primary" href="../../../../screenshots/deliverables/portfolio/web/mearrow-sns-detail-page.png" download>MEARROW SNS PNG</a><a href="./">Portfolio</a></div>
  <main>
    <article class="portfolio-canvas mearrow-web-detail" aria-label="MEARROW SNS responsive web portfolio detail">
      <div class="mearrow-web-orbit mearrow-web-orbit--one" aria-hidden="true"></div>
      <div class="mearrow-web-orbit mearrow-web-orbit--two" aria-hidden="true"></div>
      <header class="mearrow-web-detail-head">
        <div class="mearrow-web-brand-lockup">
          <img src="../../../../assets/brand/mearrow-mark.svg" alt="">
          <div><p>RESPONSIVE WEB / MEARROW</p><h1>MEARROW SNS</h1></div>
        </div>
        <p class="mearrow-web-detail-lead">Desktop, tablet, mobile.<br>One fan community.</p>
        <dl class="mearrow-web-detail-meta"><div><dt>TYPE</dt><dd>WEBSITE</dd></div><div><dt>SCOPE</dt><dd>PC · TABLET · MOBILE</dd></div><div><dt>SCREEN</dt><dd>COMMUNITY FEED</dd></div></dl>
      </header>
      <section class="mearrow-web-device-showcase" aria-label="MEARROW SNS desktop, tablet, and mobile web previews">
        <div class="mearrow-web-monitor" aria-label="Desktop web screen">
          <div class="mearrow-web-monitor-screen">
            <div class="mearrow-web-monitor-bar"><span class="mearrow-web-browser-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="mearrow-web-browser-address">desktop / mearrow.com</span></div>
            <div class="mearrow-web-monitor-viewport"><iframe src="../../../../pub/admin/mearrow-sns/index.html" title="MEARROW SNS desktop responsive screen" loading="eager" scrolling="no"></iframe></div>
          </div>
          <div class="mearrow-web-monitor-stand" aria-hidden="true"></div>
          <div class="mearrow-web-monitor-base" aria-hidden="true"></div>
        </div>
        <div class="mearrow-web-tablet" aria-label="Tablet web screen"><div class="mearrow-web-tablet-screen"><iframe src="../../../../pub/admin/mearrow-sns/index.html" title="MEARROW SNS tablet responsive screen" loading="eager" scrolling="no" data-initial-scroll-y="68"></iframe></div></div>
        <div class="mearrow-web-phone" aria-label="Mobile web screen"><div class="mearrow-web-phone-screen"><iframe src="../../../../pub/admin/mearrow-sns/index.html" title="MEARROW SNS mobile responsive screen" loading="eager" scrolling="no"></iframe></div></div>
      </section>
      <section class="mearrow-web-feature-list" aria-label="MEARROW SNS features"><p>COMMUNITY FEED</p><p>FAN VOTE</p><p>MEMBER PROFILE</p><p>SHARING</p></section>
      <footer class="mearrow-web-detail-footer"><p>MEARROW SNS / WEB</p><strong>Responsive web experience · 2026</strong></footer>
    </article>
  </main>
  <script>
    const alignTabletFeeds = () => {
      const frames = document.querySelectorAll(".mearrow-web-tablet-screen iframe[data-initial-scroll-y]");
      const alignFeeds = () => frames.forEach((frame) => {
        const scroller = frame.contentDocument?.scrollingElement;
        if (scroller) {
          scroller.style.scrollBehavior = "auto";
          scroller.scrollTop = Number(frame.dataset.initialScrollY);
        }
      });
      requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(alignFeeds, 0)));
    };
    if (document.readyState === "complete") setTimeout(alignTabletFeeds, 0);
    else window.addEventListener("load", alignTabletFeeds, { once: true });
  </script>
</body>
</html>
