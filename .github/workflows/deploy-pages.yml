name: MEARROW Pages Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to run the production Pages gate and deployment
        required: true
        default: DEPLOY
        type: string

permissions:
  contents: read

concurrency:
  group: mearrow-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Browser-gated Pages production deploy
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: pages-production
    env:
      NEXT_PUBLIC_SITE_URL: https://mearrow.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --run

      - name: Install Chromium for browser gate
        run: pnpm dlx playwright@1.58.2 install chromium

      - name: Browser data smoke test and Pages build
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$browser_path"
          DEPLOY_BROWSER_PATH="$browser_path" pnpm pages:build:production

      - name: Browser Studio modal smoke test
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$browser_path"
          STUDIO_MODAL_BROWSER_PATH="$browser_path" pnpm test:browser:studio-modal

      - name: Deploy Pages production
        run: >-
          pnpm exec wrangler pages deploy out
          --project-name kcl
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Pages production deploy $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
