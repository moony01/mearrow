name: MEARROW Workers

on:
  push:
    branches:
      - main
      - feat/cloudflare-workers-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read

concurrency:
  group: mearrow-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workers build
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_* 값은 Next.js client/server bundle에 필요합니다.
      NEXT_PUBLIC_SITE_URL: https://mearrow.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deployment environment
        run: pnpm check:deploy-env

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --run

      - name: Install Chromium for browser gate
        run: pnpm dlx playwright@1.58.2 install chromium

      - name: Browser data smoke test
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$browser_path"
          DEPLOY_BROWSER_PATH="$browser_path" pnpm test:browser:deploy

      - name: Browser news modal smoke test
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$browser_path"
          NEWS_POPUP_BROWSER_PATH="$browser_path" pnpm test:browser:news-popup

      - name: Build Workers bundle
        run: pnpm workers:build

      - name: Workers audition detail smoke test
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -n "$browser_path"
          AUDITIONS_WORKERS_BROWSER_PATH="$browser_path" pnpm test:browser:workers-auditions

  deploy-production:
    name: Deploy production Worker
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: workers-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy production Worker
        run: >-
          pnpm workers:deploy:production --
          --var "NEXT_PUBLIC_SITE_URL:${NEXT_PUBLIC_SITE_URL}"
          --var "NEXT_PUBLIC_SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL}"
          --var "NEXT_PUBLIC_SUPABASE_ANON_KEY:${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://mearrow.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Set production Supabase service secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" |
          pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          --config wrangler.jsonc --env production
